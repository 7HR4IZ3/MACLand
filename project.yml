name: MACLand
options:
  bundleIdPrefix: com.thraize.macland
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.6"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 150.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: UACGQ779PC
targets:
  MACLandMobile:
    type: application
    platform: iOS
    sources:
      - path: iOS/MACLandMobile/Sources/MACLandMobile
      - path: Shared/MACLandProtocol/Sources/MACLandProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thraize.macland.mobile
        INFOPLIST_FILE: iOS/MACLandMobile/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: WebRTC
    scheme:
      testTargets:
        - MACLandMobileTests

  MACLandMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOS/MACLandMobile/Tests/MACLandMobileTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thraize.macland.mobile-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MACLandMobile

  MACLandHost:
    type: application
    platform: macOS
    entitlements:
      path: MacHost/MACLandHost.entitlements
    sources:
      - path: MacHost/Sources/MACLandHost
      - path: Shared/MACLandProtocol/Sources/MACLandProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thraize.macland.host
        INFOPLIST_FILE: MacHost/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: MacHost/Sources/MACLandHost/VoidDisplayPrivate/MACLandVoidDisplayBridge.h
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: WebRTC
    scheme:
      testTargets:
        - MACLandHostTests

  MACLandHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacHost/Tests/MACLandHostTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thraize.macland.host-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MACLandHost
